[package]
name = "personal-app"
version = "0.1.0"
description = "Personal desktop app with encrypted local storage"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
hex = "0.4"
base64 = "0.22"

[lib]
name = "personal_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
